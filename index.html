<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Volleyball Scoreboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- VIEW: HOME -->
  <section id="view-home" class="view active">
    <div class="card text-center" style="margin-top: 2rem;">
      <h1>🏐 Voli Tarkam</h1>
      <p style="margin-bottom: 24px; color: var(--secondary);">Scoreboard & Statistik Sederhana</p>
      <button onclick="app.navTo('view-setup')" class="btn-primary">Buat Pertandingan Baru</button>
      <button onclick="app.showHistory()" class="btn-secondary">Riwayat Pertandingan</button>
    </div>
  </section>

  <!-- VIEW: SETUP MATCH -->
  <section id="view-setup" class="view">
    <h2>Buat Pertandingan</h2>
    <div class="card">
      <div class="form-group">
        <label>Nama Pertandingan</label>
        <input type="text" id="setup-match-name" placeholder="Contoh: Final RT 01 vs RT 02">
      </div>
    </div>

    <div class="team-setup-container">
      <div class="card">
        <h3>Tim A</h3>
        <input type="text" id="setup-team-a-name" placeholder="Nama Tim A">
        <label>Pemain (pisahkan dengan koma):</label>
        <textarea id="setup-team-a-players" rows="3" placeholder="Contoh: Budi, Andi, Joko"></textarea>
      </div>
      <div class="card">
        <h3>Tim B</h3>
        <input type="text" id="setup-team-b-name" placeholder="Nama Tim B">
        <label>Pemain (pisahkan dengan koma):</label>
        <textarea id="setup-team-b-players" rows="3" placeholder="Contoh: Doni, Eko, Riko"></textarea>
      </div>
    </div>

    <div class="action-buttons">
      <button onclick="app.navTo('view-home')" class="btn-secondary">Batal</button>
      <button onclick="app.startMatch()" class="btn-primary">Mulai Pertandingan</button>
    </div>
  </section>

  <!-- VIEW: LIVE SCOREBOARD -->
  <section id="view-live" class="view">
    <div class="match-header">
      <h3 id="live-match-name">Nama Pertandingan</h3>
      <button onclick="app.undoLastPoint()" class="btn-warning btn-small">↩ Undo Terakhir</button>
    </div>

    <div class="scoreboard">
      <!-- Team A -->
      <div class="team-board">
        <h2 id="live-team-a-name">Tim A</h2>
        <div class="score" id="live-score-a">0</div>
        <button onclick="app.promptPoint('A')" class="btn-primary btn-large">+ Point A</button>
      </div>
      <!-- Team B -->
      <div class="team-board">
        <h2 id="live-team-b-name">Tim B</h2>
        <div class="score" id="live-score-b">0</div>
        <button onclick="app.promptPoint('B')" class="btn-primary btn-large">+ Point B</button>
      </div>
    </div>

    <div class="card">
      <h4>Riwayat Poin Terakhir</h4>
      <ul id="live-event-list" class="event-list"></ul>
    </div>

    <button onclick="app.finishMatch()" class="btn-danger btn-full" style="margin-top:20px;">Selesaikan Pertandingan</button>
  </section>

  <!-- VIEW: SUMMARY (Statistik) -->
  <section id="view-summary" class="view">
    <h2 id="summary-match-name">Ringkasan Pertandingan</h2>
    <div class="card text-center">
      <h3>Skor Akhir</h3>
      <h1 id="summary-final-score" style="font-size: 3rem; margin: 10px 0;">0 - 0</h1>
    </div>

    <div id="summary-stats-container"></div> <!-- Tabel akan di-inject lewat JS -->

    <button onclick="app.navTo('view-home')" class="btn-primary btn-full" style="margin-top: 20px;">Kembali ke Beranda</button>
  </section>

  <!-- VIEW: HISTORY -->
  <section id="view-history" class="view">
    <h2>Riwayat Pertandingan</h2>
    <div id="history-list"></div>
    <button onclick="app.navTo('view-home')" class="btn-secondary btn-full" style="margin-top: 20px;">Kembali</button>
  </section>

  <!-- MODAL SUMBER POIN -->
  <div id="modal-point" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-title">Sumber Poin</h3>
      
      <!-- Step 1: Pilih Sumber -->
      <div id="modal-step-source">
        <p>Bagaimana <span id="modal-scoring-team-name">Tim</span> mendapatkan poin?</p>
        <div class="modal-buttons">
          <button onclick="app.selectSource('ATTACK')" class="btn-primary">Pukulan (Attack / Ace / Block)</button>
          <button onclick="app.selectSource('OPPONENT_ERROR')" class="btn-danger">Error dari Lawan</button>
        </div>
      </div>

      <!-- Step 2: Pilih Pemain -->
      <div id="modal-step-player" class="hidden">
        <p id="modal-player-prompt">Siapa pemainnya?</p>
        <div class="modal-buttons" id="modal-player-list">
          <!-- Button pemain di-inject via JS -->
        </div>
      </div>

      <button onclick="app.closeModal()" class="btn-secondary" style="margin-top: 20px; width: 100%;">Batal</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
